{% extends "base.html" %}
{% block content %}
<section class="container page">
  <span class="eyebrow">{{ t.privacy.eyebrow }}</span>
  <h1>{{ t.privacy.h1 }}</h1>
  <p>{{ t.privacy.effective_date }}</p>

  {% for s in t.privacy.sections %}
  <h2>{{ s.h2 }}</h2>
  <p>{{ s.p | safe }}</p>
  {% endfor %}
</section>
{% endblock %}
